<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal.com Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
     <script> 
        tailwind.config ={
            theme:{
                extend:{
                    colors:{
                        goal:{
                            green: '#00b140',
                            white: '#ffffff',
                            card: '#222238',
                            gray: '#8a8a9e',
                            border: '#33334d',
                            dark: '#1a1a2e',
                            darker: '#121220',
                        }
                    }
                }
            }
        }
    </script> 
</head>
<body class="bg-zinc-900 text-white font-body">
    <!-- Header -->
    <header class="bg-black text-white">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-30 px-7">               
                <!-- Logo -->
                <div class="bg-zinc-700 border-4 border-zinc-700 px-4 py-2">
                <a href="Goal.html" class="flex items-center">
                    <div class="bg-black border- border-gray-300 px-4 py-2 ">
                        <span class="text-3xl font-extrabold hover:text-green-500">GOAL</span>
                        <span class="text-white-500 text-3xl font-extrabold absolute top-0">•</span>
                        
                    </div>
                </div>
                </a>

            <!-- Navigation -->
            <nav class="hidden lg:flex items-center space-x-9 font-semibold uppercase text-sm">
                <a href="score.html" class="px-3 py-2 text-base font-extrabold text-goal-white hover:text-green-500 transition flex items-center gap-1">
                            SCORES <i class="fas fa-chevron-down text-[10px]"></i>
                        </a>
                            <div class="relative group">
                        <a href="Latest News.html" class="px-3 py-2 text-base font-extrabold text-goal-white hover:text-green-500 transition flex items-center gap-1">
                            LATEST <i class="fas fa-chevron-down text-[10px]"></i>
                        </a>
                    </div>
                    <div class="relative group">
                        <a href="competitions.html" class="px-3 py-2 text-base font-extrabold text-goal-white hover:text-green-500 transition flex items-center gap-1">
                            COMPETITIONS <i class="fas fa-chevron-down text-[10px]"></i>
                        </a>
                    </div>               

                <a href="Newsletters.html" class="hover:text-green-500 px-3 py-2 text-base font-extrabold text-goal-white  transition">Newsletters</a>
                <a href="Indivisa.html" class="hover:text-green-500 px-3 py-2 text-base font-extrabold text-goal-white  transition">Indivisa</a>
                <a href="GoalStudio.html" class="hover:text-green-500 px-3 py-2 text-base  font-extrabold text-goal-white  transition">GoalStudio</a>
                <a href="Shop.html" class="hover:text-green-500 px-3 py-2 text-base font-extrabold text-goal-white  transition">Shop</a>
            </nav>

            <!-- Right Actions -->
                <!-- Search -->
            <div class="p-6 border-b border-gray-800">

                <div class="flex items-center justify-between">

                    <div class="w-[330px] bg-[#1f1f1f] rounded-full px-5 py-3 flex items-center gap-3">
                        <i class="fas fa-search text-gray-400"></i>
                        <input
                            type="text"
                            placeholder="Search for matches"
                            class="bg-transparent outline-none text-white w-full">
                    </div>
                    <!-- login -->
                    <button class="text-goal-gray-500 hover:text-green-500 transition text-lg">
                        <i class="fas fa-user"></i>
                        <span>login</span>
                    </button>
                    <!-- Mobile Menu Button -->
                    <button
                        id="mobileMenuBtn"
                        class="lg:hidden text-white text-2xl"
                    >
                        <i class="fas fa-bars"></i>
                    </button>

                    <!-- Mobile Navigation -->
                    <div
                        id="mobileMenu"
                        class="fixed top-0 left-[-100%] w-72 h-screen bg-goal-darker text-white z-50 transition-all duration-300 overflow-y-auto"
                    >
                        <!-- Header -->
                        <div class="flex items-center justify-between p-4 border-b border-gray-700">
                            <h2 class="text-xl font-bold">MENU</h2>

                            <button id="closeMenuBtn" class="text-2xl">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>

                        <!-- Navigation Links -->
                        <nav class="flex flex-col">

                            <a href="Goal.html" class="px-5 py-4 uppercase border-b border-gray-700 hover:bg-gray-800">
                                goal
                            </a>

                            <a href="Score.html" class="px-5 py-4 border-b border-gray-700 hover:bg-gray-800">
                                Scores
                            </a>

                            <a href="Latest News.html" class="px-5 py-4 border-b border-gray-700 hover:bg-gray-800">
                                Latest News
                            </a>

                            <a href="competitions.html" class="px-5 py-4 uppercase border-b border-gray-700 hover:bg-gray-800">
                                competition
                            </a>

                            <a href="Newsletters.html" class="px-5 py-4 upercase border-b border-gray-700 hover:bg-gray-800">
                                Newsletters
                            </a>

                            <a href="Indivisa.html" class="px-5 uppercase py-4 border-b border-gray-700 hover:bg-gray-800">
                                indivisa
                            </a>

                            <a href="GoalStudio.html" class="px-5 py-4 uppercaseborder-b border-gray-700 hover:bg-gray-800">
                                goalstudio
                            </a>

                            <a href="Shop.html" class="px-5 py-4 border-b border-gray-700 hover:bg-gray-800">
                                Shop
                            </a>

                            <a href="article-details.html" class="px-5 py-4 uppercase border-b border-gray-700 hover:bg-gray-800">
                                article-detail
                            </a>

                            </nav>
                    </div>

                    <!-- Overlay -->
                    <div
                        id="overlay"
                        class="fixed inset-0 bg-black/50 hidden z-40"
                    ></div>

                    
                </div>
            </div>
        </div>
                </div>
            </div>
        </div>

<script>
                        const mobileMenuBtn = document.getElementById("mobileMenuBtn");
                        const closeMenuBtn = document.getElementById("closeMenuBtn");
                        const mobileMenu = document.getElementById("mobileMenu");
                        const overlay = document.getElementById("overlay");

                        mobileMenuBtn.addEventListener("click", () => {
                            mobileMenu.style.left = "0";
                            overlay.classList.remove("hidden");
                        });

                        closeMenuBtn.addEventListener("click", closeMenu);
                        overlay.addEventListener("click", closeMenu);

                        function closeMenu() {
                            mobileMenu.style.left = "-100%";
                            overlay.classList.add("hidden");
                        }
                    </script>
        <!-- Search Bar (hidden by default) -->
        <div id="searchBar" class="hidden bg-goal-darker border-t border-goal-border">
            <div class="max-w-7xl mx-auto px-4 py-3">
                <div class="flex items-center gap-3">
                    <i class="fas fa-search text-goal-gray"></i>
                    <input type="text" placeholder="Search for news, players, teams..." class="bg-transparent flex-1 text-white placeholder-goal-gray outline-none text-sm">
                    <button class="text-goal-gray hover:text-white"><i class="fas fa-times"></i></button>
                </div>
            </div>
        </div>
    </header>
    <a href="article-details.html" class="block bg-goal-card rounded-lg overflow-hidden group hover:ring-1 hover:ring-goal-green transition"></a>

</body>
</html>
